apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: campusconnect-user-service:lab8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: USER_SERVICE_PORT
              valueFrom:
                configMapKeyRef: { name: campusconnect-config, key: USER_SERVICE_PORT }
