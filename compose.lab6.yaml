services:
  user-service:
    build: ./microservices/user-service
    ports: ["3001:3001"]
    environment: { USER_SERVICE_PORT: 3001 }
    networks: [campus-network]
  product-service:
    build: ./microservices/product-service
    ports: ["3002:3002"]
    environment: { PRODUCT_SERVICE_PORT: 3002 }
    networks: [campus-network]
  order-service:
    build: ./microservices/order-service
    ports: ["3003:3003"]
    environment:
      ORDER_SERVICE_PORT: 3003
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on: [user-service, product-service]
    networks: [campus-network]
networks:
  campus-network:
