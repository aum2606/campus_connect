name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm test --prefix backend

  service-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, user-service, product-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - run: find microservices -name '*.js' -exec node --check {} +
      - run: docker build -t campusconnect-${{ matrix.service }}:${{ github.sha }} microservices/${{ matrix.service }}
